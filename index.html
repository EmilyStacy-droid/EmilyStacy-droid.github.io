<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emily Stacy | Full Stack & Learning Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Metrophobic&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --warm-bg: #fffcf5; 
        --warm-slate: #2d4a3e;
        --warm-grey: #5c554a; 
        --warm-border: #e8f3ee;
      }
      body {
        font-family: 'Metrophobic', sans-serif;
        background-color: var(--warm-bg);
        color: var(--warm-grey);
        font-size: 16px; 
        overflow-x: hidden;
      }
      .font-display { font-family: 'Space Grotesk', sans-serif; }
      .glass {
        background: rgba(255, 252, 245, 0.95);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--warm-border);
      }
      h1, h2, h3 { color: var(--warm-slate) !important; font-family: 'Space Grotesk', sans-serif; }
      .prose { max-width: 72ch; color: var(--warm-grey); line-height: 1.9; }
      .prose blockquote { border-left: 4px solid #fde9e4; padding-left: 2rem; font-style: italic; color: #84a59d; }
      /* Custom utility for animations */
      .animate-in {
        animation: fadeIn 0.8s ease-out forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
